<title>Lesson 6 Day 2: Handle Equipment Safely and Build a Service Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: phone-first lesson player. One screen at a time in a centred column, sticky progress header, fixed bottom nav. */
:root{
  --paper:#F8FCF9; --surface:#FFFFFF; --ink:#18304C; --muted:#56687D; --line:#D5E3E0;
  --teal:#237E85; --teal-soft:#E4F2F1; --gold:#EAA83A; --gold-ink:#18304C; --gold-soft:#FFF4E0;
  --orange:#C46F1E; --green:#2E8C48; --green-soft:#E1F4E6; --red:#C43737; --red-soft:#FCE6E6;
  --ticket:#FFFDF6; --shadow:0 1px 2px rgba(24,48,76,.08),0 4px 14px rgba(24,48,76,.07);
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ticket:"Courier Prime","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1B2A; --surface:#172739; --ink:#E5EDF5; --muted:#9FB0C2; --line:#2B3F55;
  --teal:#5DBAC1; --teal-soft:#183A42; --gold:#F0B95A; --gold-ink:#1A2433; --gold-soft:#3A3020;
  --orange:#F0A060; --green:#5CC27A; --green-soft:#183A26; --red:#F07B7B; --red-soft:#3E1F24;
  --ticket:#1D2E42; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1B2A; --surface:#172739; --ink:#E5EDF5; --muted:#9FB0C2; --line:#2B3F55;
  --teal:#5DBAC1; --teal-soft:#183A42; --gold:#F0B95A; --gold-ink:#1A2433; --gold-soft:#3A3020;
  --orange:#F0A060; --green:#5CC27A; --green-soft:#183A26; --red:#F07B7B; --red-soft:#3E1F24;
  --ticket:#1D2E42; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.voicebtn{flex:none;border:1.5px solid var(--teal);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.voicebtn[aria-pressed="true"]{background:var(--teal);color:var(--paper)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:0 110px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
.wrap{max-width:760px;margin-inline:auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px}
.chip{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);padding:4px 10px;border-radius:999px;white-space:nowrap}
.top .label{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--teal);border-radius:inherit;transition:width .3s}

main{padding-block:22px 10px}
.screen{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.h1{font-size:clamp(26px,6vw,34px);font-weight:700}
.h2{font-size:clamp(22px,5vw,28px);font-weight:700}
.sub{color:var(--muted);font-size:15px}

/* lesson cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{font-size:16px;font-weight:600;margin-bottom:4px}
.card p{font-size:15px;color:var(--muted)}
.card ul.mini{margin:4px 0 0;padding-left:18px;font-size:15px;color:var(--muted)}
.card:nth-child(6n+1) h3{color:var(--teal)} .card:nth-child(6n+2) h3{color:var(--orange)}
.card:nth-child(6n+3) h3{color:var(--green)} .card:nth-child(6n+4) h3{color:#4F6FB8}
.card:nth-child(6n+5) h3{color:#8A5CB0} .card:nth-child(6n) h3{color:var(--red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card:nth-child(6n+4) h3{color:#8FA9E8}:root:not([data-theme="light"]) .card:nth-child(6n+5) h3{color:#C59BE6}}
:root[data-theme="dark"] .card:nth-child(6n+4) h3{color:#8FA9E8} :root[data-theme="dark"] .card:nth-child(6n+5) h3{color:#C59BE6}
ul.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.bul li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;position:relative}
ul.bul li::before{content:"";position:absolute;left:16px;top:21px;width:9px;height:9px;border-radius:50%;background:var(--teal)}
.quote{font-size:21px;font-weight:500;background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:20px}
.task{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.task b{color:var(--orange)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{background:var(--ink);color:var(--paper);text-align:left;font-weight:600;padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
td:empty::after{content:"";display:block;min-width:70px;height:1.2em}

/* home */
.hero{display:flex;flex-direction:column;gap:10px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.day{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.day b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.day span{font-weight:600;font-size:15px;line-height:1.3}
.day small{color:var(--muted);font-size:12.5px}
.day[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input[type=text]{font:inherit;font-weight:400;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%}
input[type=text]:focus{border-color:var(--teal);outline:none}
.err{color:var(--red);font-size:14px;min-height:1.2em}
.plan{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.plan div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.plan div:first-child{border-top:0}
.plan div.act{font-weight:600;color:var(--orange)}
.plan em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rule{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rule .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:15px}
.rule p{font-size:14.5px;color:var(--muted)} .rule h3{font-size:16px}

/* activity intro */
.actbadge{display:flex;align-items:center;gap:16px;background:var(--act);color:#fff;border-radius:18px;padding:18px 20px}
.actbadge .big{font-size:58px;font-weight:700;line-height:1}
.actbadge .meta{display:flex;flex-direction:column;gap:2px}
.actbadge .meta b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.actbadge .meta span{font-size:20px;font-weight:600;line-height:1.25}
.facts{display:grid;gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--act)}

/* question */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qhead .count{font-weight:600;color:var(--act);font-size:15px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--act)}
.qcard{background:var(--surface);border:2px solid var(--act);border-radius:16px;padding:20px 18px;text-align:center}
.qcard .q{font-size:clamp(19px,4.6vw,23px);font-weight:600}
.qcard .clue{color:var(--muted);font-style:italic;margin-top:6px}
.qcard.scr .q{font-family:var(--f-ticket);letter-spacing:.18em;font-size:clamp(24px,7vw,32px)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;min-height:58px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--act);color:var(--act);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.tf{justify-content:center;font-size:20px;font-weight:700;min-height:80px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .l{background:var(--green);border-color:var(--green);color:var(--surface)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .l{background:var(--red);border-color:var(--red);color:var(--surface)}
.opt.dim{opacity:.55}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--green-soft)} .fb.no{background:var(--red-soft)}
.fb strong{font-size:17px} .fb.ok strong{color:var(--green)} .fb.no strong{color:var(--red)}
.fb p{font-size:15px}
.hint{color:var(--muted);font-size:14px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.nav .wrap{display:flex;gap:10px;align-items:center}
.nav .grow{flex:1;font-size:13px;color:var(--muted);min-width:0}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:600;font-size:16px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{width:100%;padding:16px;font-size:18px}

/* result ticket */
.ticket{background:var(--ticket);color:var(--ink);border-radius:6px;padding:22px 20px 26px;font-family:var(--f-ticket);box-shadow:var(--shadow);position:relative;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%}
.ticket .hd{text-align:center;display:flex;flex-direction:column;gap:2px;border-bottom:2px dashed var(--line);padding-bottom:12px}
.ticket .hd b{font-size:18px;letter-spacing:.12em}
.ticket .hd span{font-size:13px;color:var(--muted)}
.ticket .who{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;padding-block:12px;border-bottom:2px dashed var(--line)}
.ticket .who dt{color:var(--muted)} .ticket .who dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.ticket .lines{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:2px dashed var(--line)}
.ticket .ln{display:flex;gap:8px;font-size:15px;align-items:baseline}
.ticket .ln span:first-child{flex:1;min-width:0}
.ticket .ln b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ticket .tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;font-size:20px;font-weight:700}
.ticket .tot small{font-size:14px;color:var(--muted);font-weight:400}
.award{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.award img{width:min(200px,55vw);height:auto;max-width:100%;animation:pop .6s ease-out both}
.award .stars{font-size:30px;letter-spacing:.15em;color:var(--gold)}
.award h2{font-size:24px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.reveal{animation:rise .45s ease-out both}
@media (prefers-reduced-motion: reduce){.reveal{animation:none}}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.award img{animation:none}.meter i{transition:none}}
.note{font-size:14px;color:var(--muted);text-align:center}
.confirm{background:var(--red-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sfig{margin:0;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.sfig img{display:block;width:100%;max-height:300px;object-fit:contain}
.card .cimg{display:block;width:100%;height:120px;object-fit:contain;margin-bottom:8px;border-radius:10px}
.homelink{align-self:flex-start;font-size:14px;color:var(--teal);text-decoration:none;font-weight:600;padding:6px 0}
.homelink:hover{text-decoration:underline}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
:root{--paper:#FBFAF6;--teal:#306651;--teal-soft:#E6F3EA;--gold:#E0A33A;--gold-soft:#FFF4D6;--line:#D5DDD8;--ink:#203446;--muted:#546675;--orange:#BE6652;--green:#254B68}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1C1A18;--surface:#272421;--teal:#8FCBAE;--teal-soft:#33302B;--gold:#F2C46B;--gold-soft:#3B3220;--line:#3B3631;--ink:#EEE9E3;--muted:#B5ADA4;--orange:#F0A080;--green:#9FD08A;--ticket:#2B2724}}
:root[data-theme="dark"]{--paper:#1C1A18;--surface:#272421;--teal:#8FCBAE;--teal-soft:#33302B;--gold:#F2C46B;--gold-soft:#3B3220;--line:#3B3631;--ink:#EEE9E3;--muted:#B5ADA4;--orange:#F0A080;--green:#9FD08A;--ticket:#2B2724}
</style>

  <div class="wrap"><span class="chip" id="topChip">Day 1</span><span class="label" id="topLabel"></span><button type="button" class="voicebtn" id="voiceBtn" aria-pressed="false" hidden>&#9835; Read to me</button></div>

resent a bill or change to a customer", "A tray that keeps drinks cold", "A cutting board for fruit"], "ans": "B", "why": "A bill tray is small and holds the bill and change. It is not for carrying glasses."}, {"q": "What is a CORKSCREW used for?", "opts": ["Opening a can", "Removing a metal bottle cap", "Stirring a drink", "Removing a cork from a bottle"], "ans": "D", "why": "A corkscrew removes corks. A bottle opener removes metal caps."}]}, {"title": "Analyze It", "kind": "Multiple choice: analysis", "minutes": 7, "how": "Compare tools that look alike, find the wrong match, or spot the clue. Then choose the best answer.", "items": [{"q": "Why is the ELECTRIC WATER HEATER treated with special care?", "opts": ["It is the most expensive equipment", "It has both burn and electrical hazards", "It is used only by customers", "It breaks easily when touched"], "ans": "B", "why": "Hot-water equipment can cause burns, and it is powered, so it is also an electrical hazard."}, {"q": "A student reaches for the blender controls with wet hands. What is the RISK?", "opts": ["There is no risk if the blender is new", "The blender will make the drink too cold", "The blender buttons will get dirty", "Water and electricity together can cause an electric shock"], "ans": "D", "why": "Water and electric controls create a risk. Keep hands dry and keep the blender unplugged for class."}, {"q": "Which statement shows a CORRECT tool–precaution pair?", "opts": ["Knife – protect hands and store with the blade covered", "Ice scoop – leave it inside the ice with the handle buried", "Blender – touch it with wet hands to clean it fast", "Service tray – load as many glasses as possible"], "ans": "A", "why": "A knife needs safe storage away from exposed blades. The other choices create hygiene or safety problems."}, {"q": "Ice bucket, ice scoop, and tongs all work around ice. How are they DIFFERENT?", "opts": ["All three transfer ice", "All three store ice", "The bucket stores ice, the scoop transfers ice, and tongs grip objects", "The tongs store ice and the bucket grips it"], "ans": "C", "why": "They are related but not the same: container, transfer tool, and gripping tool."}, {"q": "Which item is WRONG for its stated use?", "opts": ["Using a refrigerator to keep drinks cool", "Using a bill tray to carry several served glasses", "Using a coaster under a glass", "Using a chopping board under a knife"], "ans": "B", "why": "A bill tray is small and meant for the bill. Moving served glasses needs a stable service tray."}]}, {"title": "Apply It", "kind": "Multiple choice: situational application", "minutes": 8, "how": "Several choices may seem possible. Choose the BEST tool or action: correct purpose, clean, and safe.", "items": [{"q": "Someone at the station reaches straight into the ice with bare hands. What should be done?", "opts": ["Use the tongs meant for lemon slices", "Wash hands first, then keep using bare hands", "Use a clean, dedicated ice scoop to get the ice", "Use a drinking glass to scoop the ice"], "ans": "C", "why": "A clean dedicated ice scoop avoids hand contact and keeps the ice hygienic. A glass can chip into the ice."}, {"q": "You notice a cracked glass about to be used for a customer. What is the BEST action?", "opts": ["Remove it from service safely", "Use it carefully this time only", "Turn the cracked side away from the guest", "Put a coaster under it"], "ans": "A", "why": "A cracked glass is a safety risk. It should be removed from service safely."}, {"q": "You must carry four served glasses across the counter. What is the BEST choice?", "opts": ["Carry them one at a time on a coaster", "Hold two glasses in each hand", "Stack the glasses on a bill tray", "A stable service tray with the load balanced"], "ans": "D", "why": "A stable tray with a well-distributed load carries several items safely."}, {"q": "A café must keep bottled drinks cool before service. Which equipment and precaution are BEST?", "opts": ["Ice bucket; leave it uncovered all day", "Refrigerator; do not leave the door open unnecessarily", "Electric water heater; keep it unplugged", "Service tray; place it near a window"], "ans": "B", "why": "The refrigerator is for cold storage. Keeping the door closed helps it stay cool."}, {"q": "After cutting fruit, a knife is left on the counter with the blade exposed. What should you do?", "opts": ["Put it in the ice bucket to keep it clean", "Leave it so it is ready for the next use", "Cover it with a napkin", "Clean it and store it properly with the blade protected"], "ans": "D", "why": "Sharp tools must be stored appropriately. A hidden blade under a napkin can still cut someone."}, {"q": "A classmate puts a dirty bar spoon back with the clean tools. What is the BEST response?", "opts": ["Leave it, since it will be washed later", "Remove it, clean it, and store it properly", "Wipe it on an apron and use it", "Tell the next user to be careful"], "ans": "B", "why": "Dirty tools should be cleaned and stored properly so they do not contaminate clean ones."}]}], "minutes": 45, "intro": true, "name": "Lesson 6 - Day 2", "label": "Day 2 of 2", "cover": "Lesson 6 &bull; Day 2 of 2"}], "slides": {"26": {"title": "Session 3  |  Equipment and Safe Handling", "sub": "Identify the station item and recognize basic hazards before anyone uses it.", "cards": [{"h": "COLD STORAGE", "b": "Refrigerator: keeps food or drinks cool.", "list": null}, {"h": "ICE HANDLING", "b": "Ice bucket and ice scoop: hold and transfer ice.", "list": null, "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAF0AU0DASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAECBAUGAwcI/8QANxAAAQMDAgUDAwIGAgIDAQAAAQACAwQFERIhBhMiMUFRYXEHIzIUMxUkQmKBkRZSNKEXJVNy/8QAGAEBAQEBAQAAAAAAAAAAAAAAAAECAwT/xAAeEQEBAAMBAQEBAQEAAAAAAAAAAQIRMRIhQQNRE//aAAwDAQACEQMRAD8A9 /* ---------------- read aloud (browser text-to-speech) ---------------- */
const VOICE_OK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let homeVoice = (store.get('fcs9-voice') === true);
function pickVoice(){
  if (!VOICE_OK) return null;
  const want = (DATA.lang || 'en').toLowerCase();
  const vs = speechSynthesis.getVoices();
  const pref = want.startsWith('fil') ? ['fil', 'tl'] : [want.slice(0,2)];
  for (const p of pref){ const v = vs.find(x => x.lang && x.lang.toLowerCase().replace('_','-').startsWith(p)); if (v) return v; }
  return null;
}
function speak(text){
  if (!VOICE_OK || !text) return;
  try {
    speechSynthesis.cancel();
    const clean = String(text).replace(/[✔✘★☆»«▾♫☝]/g, '').replace(/_{2,}/g, ' blank ').replace(/\s+/g, ' ').trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    const v = pickVoice();
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = DATA.lang || 'en-US';
    u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch(e) {}
}
function stopSpeak(){ if (VOICE_OK) try { speechSynthesis.cancel(); } catch(e) {} }
function voiceOn(){ return !!(S && S.voice && VOICE_OK); }
function sayIfOn(text){ if (voiceOn()) speak(text); }
function syncVoiceBtn(){
  const b = document.getElementById('voiceBtn');
  b.hidden = !VOICE_OK;
  b.setAttribute('aria-pressed', voiceOn());
  b.innerHTML = '&#9835; Read to me: ' + (voiceOn() ? 'ON' : 'OFF');
}
function screenText(root){
  return [...root.querySelectorAll('.screen > *')].filter(el => !el.hidden).map(el => el.innerText).join('. ');
}
if (VOICE_OK){ try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch(e) {} }
document.addEventListener('click', e => {
  if (e.target.closest('#voiceBtn') && S){
    S.voice = !S.voice; save(); syncVoiceBtn();
    store.set('fcs9-voice', S.voice);
    if (S.voice) sayIfOn(screenText(document.getElementById('main'))); else stopSpeak();
  }
});

/* click-to-reveal: lesson and how-to screens show one part per tap on "Show more" */
let PARTS = [];
function revealParts(root){
  const sc = screens[S.idx];
  const groups = sc && sc.t === 'howto' ? '.nogroup' : '.cards,.bul';
  const out = [];
  const kids = [...root.querySelectorAll('.screen > *')].slice(1);   // first child = title block
  kids.forEach(el => {
    if (el.matches(groups)) out.push(...el.children);
    else if (el.querySelector(':scope > .plan')) { [...el.children].forEach(c => c.matches(groups) ? out.push(...c.children) : out.push(c)); }
    else out.push(el);
  });
  return out;
}
function setupReveal(root){
  PARTS = revealParts(root);
  if (!S.rev) S.rev = {};
  const shown = Math.min(S.rev[S.idx] || 0, PARTS.length);
  PARTS.forEach((el, i) => { el.hidden = i >= shown; });
  updateRevealButton();
}
function updateRevealButton(){
  const shown = (S.rev && S.rev[S.idx]) || 0;
  const next = document.getElementById('nextBtn'), note = document.getElementById('navNote');
  if (shown < PARTS.length){
    next.innerHTML = 'Show more &#9662;';
    note.textContent = (PARTS.length - shown) + ' more to show';
  } else {
    next.innerHTML = 'Next &raquo;';
    note.textContent = '';
  }
}
function revealOne(){
  const shown = (S.rev && S.rev[S.idx]) || 0;
  if (shown >= PARTS.length) return false;
  const el = PARTS[shown];
  el.hidden = false;
  el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal');
  el.style.animationDelay = '0ms';
  S.rev[S.idx] = shown + 1; save();
  updateRevealButton();
  el.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  sayIfOn(el.innerText);
  return true;
}

/* reveal the parts of a screen one after another */
function stagger(root){
  const groups = '.cards,.bul,.opts,.rules,.plan,.facts,.days,.fields,.lines,.row';
  const items = [];
  root.querySelectorAll('.screen > *').forEach(el => {
    if (el.matches(groups)) items.push(...el.children);
    else if (el.querySelector(':scope > .cards, :scope > .plan, :scope > .days, :scope > .fields')) {
      [...el.children].forEach(c => c.matches(groups) ? items.push(...c.children) : items.push(c));
    } else items.push(el);
  });
  items.forEach((el, i) => {
    el.classList.add('reveal');
    el.style.animationDelay = (i < 10 ? i * 160 : 1600 + (i - 10) * 80) + 'ms';
  });
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function NM(d){ return d.name || ('Day ' + d.num); }
function dayOf(n){ return DATA.days.find(d => d.num === n); }

function buildScreens(day){
  const list = [{t:'howto'}];
  for (const e of day.sequence){
    if (typeof e === 'number') list.push({t:'lesson', s:e});
    else {
      const ai = Number(e.slice(1)) - 1;
      if (day.intro !== false) list.push({t:'intro', a:ai});
      day.activities[ai].items.forEach((_, qi) => list.push({t:'q', a:ai, q:qi}));
    }
  }
  list.push({t:'finish'});
  return list;
}

  m.innerHTML = `

      ${DATA.home?`<a class="homelink" href="${DATA.home}">&laquo; All lessons</a>`:''}

    </div>

        <label class="f" for="sec">Grade &amp; section<input type="text" id="sec" placeholder="e.g. 9-Sampaguita" value="${esc(prof.section||'')}"></label>
      </div>

    </div>

      <p class="eyebrow" style="margin-bottom:8px">How do you want to learn?</p>
      <div class="modes">
        <button type="button" class="day" data-voice="0" aria-pressed="${!homeVoice}"><b>Option 1</b><span>I will read it myself</span><small>Quiet reading at my own pace</small></button>
        <button type="button" class="day" data-voice="1" aria-pressed="${homeVoice}"><b>Option 2</b><span>Read it to me</span><small>The lesson is read aloud. Turn on your sound.</small></button>
      </div>
    </div>

  </section>`;
  const setStartLabel = () => {
    const sv = store.get(KEY(homeDay));
    document.getElementById('startBtn').innerHTML = (sv && !sv.done ? 'Continue ' : 'Start ') + NM(dayOf(homeDay)) + ' &raquo;';
  };
  setStartLabel();
  m.querySelectorAll('.day').forEach(b => b.onclick = () => {
    homeDay = Number(b.dataset.day);
    m.querySelectorAll('.day').forEach(x => x.setAttribute('aria-pressed', x === b));
    setStartLabel();
  });
  stagger(m); lastShown = null;
  m.querySelectorAll('[data-voice]').forEach(b => b.onclick = () => {
    homeVoice = b.dataset.voice === '1';
    m.querySelectorAll('[data-voice]').forEach(x => x.setAttribute('aria-pressed', x === b));
    if (homeVoice) speak('Sige! Babasahin ko ang aralin para sa iyo.');
    else stopSpeak();
  });

    const name = document.getElementById('nm').value.trim();
    const section = document.getElementById('sec').value.trim();
    if (name.length < 2){ document.getElementById('err').textContent = 'Please type your full name first.'; document.getElementById('nm').focus(); return; }
    if (!section){ document.getElementById('err').textContent = 'Please type your grade and section.'; document.getElementById('sec').focus(); return; }
    store.set('fcs-site-profile', {name, section});
    startDay(homeDay, name, section);

function startDay(n, name, section){
  const day = dayOf(n);
  screens = buildScreens(day);
  const sv = store.get(KEY(n));
  if (sv && !sv.done && sv.name === name){
    S = sv;
  } else {
    const attempts = (store.get(AKEY(n)) || 0) + 1;
    store.set(AKEY(n), attempts);
    S = {day:n, name, section, idx:0, answers:{}, attempt:attempts, done:false, finishedAt:null};
  }
  S.section = section;
  S.voice = homeVoice;
  save();
  render();
}
function save(){ store.set(KEY(S.day), S); }

/* ---------------- player ---------------- */
function render(){
  const day = dayOf(S.day);
  const sc = screens[S.idx];
  document.getElementById('top').hidden = false;
  document.getElementById('nav').hidden = sc.t === 'result';
  document.getElementById('topChip').textContent = NM(day);
  document.getElementById('topLabel').textContent = day.title;
  document.getElementById('meter').style.width = Math.round(100 * S.idx / (screens.length - 1)) + '%';
  const m = document.getElementById('main');
  const back = document.getElementById('backBtn'), next = document.getElementById('nextBtn'), note = document.getElementById('navNote');
  back.disabled = false; next.disabled = false; next.innerHTML = 'Next &raquo;'; note.textContent = '';
  m.style.removeProperty('--act');

  if (sc.t === 'howto') m.innerHTML = viewHowto(day);
  else if (sc.t === 'lesson') m.innerHTML = viewLesson(DATA.slides[sc.s]);
  else if (sc.t === 'intro'){ m.style.setProperty('--act', ACT_COLORS[sc.a]); m.innerHTML = viewIntro(day, sc.a); next.innerHTML = 'Begin &raquo;'; }
  else if (sc.t === 'q'){
    m.style.setProperty('--act', ACT_COLORS[sc.a]);
    m.innerHTML = viewQ(day, sc.a, sc.q);
    const k = sc.a + '-' + sc.q;
    if (!(k in S.answers)){ next.disabled = true; note.textContent = 'Answer to unlock Next'; }
    m.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(sc, b.dataset.l));
  }
  else if (sc.t === 'finish'){ m.innerHTML = viewFinish(day); next.innerHTML = 'Show my trophy &raquo;'; }
  window.scrollTo(0,0);
  const h = m.querySelector('h1,h2'); if (h){ h.setAttribute('tabindex','-1'); }
  const fresh = lastShown !== S.idx;
  if (sc.t === 'lesson' || sc.t === 'howto'){ setupReveal(m); lastShown = S.idx; }
  else { PARTS = []; if (fresh){ stagger(m); lastShown = S.idx; } }
  syncVoiceBtn();
  if (fresh) { if (voiceOn()) speak(screenText(m)); else stopSpeak(); }
}

function viewHowto(day){
  return `<section class="screen">
    <div><span class="eyebrow">${day.cover || ('Day ' + day.num + ' of 4')}</span><h1 class="h1" style="margin-top:6px">${esc(day.title)}</h1><p class="sub" style="margin-top:6px">${esc(day.blurb)}</p></div>
    <div class="rules">
      <div class="rule"><span class="n">1</span><div><h3>Read and study</h3><p>Go through each lesson screen with Next and Back.</p></div></div>
      <div class="rule"><span class="n">2</span><div><h3>Answer the activities</h3><p>Tap the answer you think is right. You get one try per item.</p></div></div>
      <div class="rule"><span class="n">3</span><div><h3>Read the feedback</h3><p>See why the answer is correct. Then Next unlocks.</p></div></div>
      <div class="rule"><span class="n">4</span><div><h3>Earn your trophy</h3><p>Finish all 3 activities, then screenshot your result for your teacher.</p></div></div>
    </div>
    <div><p class="eyebrow" style="margin-bottom:8px">${day.minutes||40}-minute time plan</p>
      <div class="plan">${day.plan.map(([l,m]) => `<div class="${l.startsWith('Activity')?'act':''}"><span>${esc(l)}</span><em>${m} min</em></div>`).join('')}</div>
    </div>
  </section>`;
}

function viewLesson(sl){
  let h = `<section class="screen"><div>`;
  h += `<h1 class="h2">${esc(sl.title)}</h1>`;
  if (sl.sub) h += `<p class="sub" style="margin-top:6px">${esc(sl.sub)}</p>`;
  h += `</div>`;
  if (sl.img) h += `<figure class="sfig"><img src="${sl.img}" alt="" loading="lazy"></figure>`;
  if (sl.quote) h += `<p class="quote">${esc(sl.quote)}</p>`;
  else if (sl.title === 'Essential Question' && sl.bullets.length) h += `<p class="quote">${esc(sl.bullets[0])}</p>`;
  else if (sl.bullets.length) h += `<ul class="bul">${sl.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
  if (sl.cards.length) h += `<div class="cards">${sl.cards.map(c => `<div class="card${c.img?' hasimg':''}">${c.img?`<img class="cimg" src="${c.img}" alt="" loading="lazy">`:''}${c.h?`<h3>${esc(c.h)}</h3>`:''}${c.b?`<p>${esc(c.b)}</p>`:''}${c.list?`<ul class="mini">${c.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`;
  if (sl.table){
    const [hd, ...rows] = sl.table;
    const blank = rows.some(r => r.some(c => !c));
    h += `<div class="tablebox"><table><thead><tr>${hd.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if (blank) h += `<p class="task"><b>Write it:</b> Copy this table into your notebook and fill it in.</p>`;
  }
  if (sl.task){
    const i = sl.task.indexOf(':');
    h += `<p class="task"><b>${esc(i>0 && i<40 ? sl.task.slice(0,i) : 'Remember')}:</b> ${esc(i>0 && i<40 ? sl.task.slice(i+1).trim() : sl.task)}</p>`;
  }
  return h + `</section>`;
}

function viewIntro(day, ai){
  const a = day.activities[ai];
  return `<section class="screen">
    <div class="actbadge"><span class="big">${ai+1}</span><div class="meta"><b>Activity ${ai+1}</b><span>${esc(a.title)}</span></div></div>
    <div class="facts">
      <div class="fact"><b>Type</b>${esc(a.kind)}</div>
      <div class="fact"><b>What to do</b>${esc(a.how)}</div>
      <div class="fact"><b>Items and time</b>${a.items.length} items, about ${a.minutes} minutes</div>
      <div class="fact"><b>Scoring</b>1 point for each correct answer. One try per item, so think before you tap.</div>
    </div>
  </section>`;
}

function viewQ(day, ai, qi){
  const a = day.activities[ai], it = a.items[qi], k = ai + '-' + qi;
  const picked = S.answers[k];
  const done = picked !== undefined;
  const lines = it.q.split('\n');
  const scramble = lines.length > 1 && /^[A-Z]+$/.test(lines[0]);
  const tf = it.opts.length === 2 && it.opts[0] === 'TRUE';
  let h = `<section class="screen">
    <div class="qhead"><span class="eyebrow" style="color:var(--act)">Activity ${ai+1}: ${esc(a.title)}</span></div>
    <div class="qhead"><span class="count">Item ${qi+1} of ${a.items.length}</span><span class="dots">${a.items.map((_,j)=>`<i class="${j<=qi?'on':''}"></i>`).join('')}</span></div>
    <div class="qcard ${scramble?'scr':''}"><p class="q">${esc(lines[0])}</p>${lines.slice(1).map(l=>`<p class="clue">${esc(l)}</p>`).join('')}</div>
    <div class="opts" role="group" aria-label="Answer choices">`;
  it.opts.forEach((o, j) => {
    const L = LETTERS[j];
    let cls = 'opt' + (tf ? ' tf' : '');
    if (done){ if (L === it.ans) cls += ' right'; else if (L === picked) cls += ' wrong'; else cls += ' dim'; }
    h += `<button type="button" class="${cls}" data-l="${L}" ${done?'disabled':''}>${tf ? esc(o) : `<span class="l">${L}</span><span>${esc(o)}</span>`}</button>`;
  });
  h += `</div>`;
  if (done){
    const ok = picked === it.ans;
    h += `<div class="fb ${ok?'ok':'no'}"><strong>${ok ? '✔ Correct! +1 point' : '✘ Not quite. The answer is ' + it.ans + '.'}</strong><p>${esc(it.why)}</p></div>`;
  } else h += `${(day.intro === false && qi === 0) ? `<p class="task"><b>Activity ${ai+1}:</b> ${esc(a.how)}</p>` : ''}<p class="hint">Tap the best answer. You only get one try for this item.</p>`;
  return h + `</section>`;
}

function answer(sc, L){
  const k = sc.a + '-' + sc.q;
  if (k in S.answers) return;
  S.answers[k] = L;
  save();
  const y = window.scrollY;
  render();
  const fb = document.querySelector('.fb');
  window.scrollTo(0, y);
  if (fb) fb.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  if (fb) sayIfOn(fb.innerText);
}

function viewFinish(day){
  const total = day.activities.reduce((a,x)=>a+x.items.length,0);
  return `<section class="screen">
    <div><span class="eyebrow">All activities answered</span><h1 class="h1" style="margin-top:6px">You finished ${NM(day)}!</h1></div>
    <ul class="bul">
      <li>You studied ${esc(day.title)}.</li>
      <li>You answered all ${total} items in 3 activities.</li>
      <li>Tap <b>Show my trophy</b> to see your scores. Take a screenshot of it and send it to your teacher.</li>
    </ul>
    <div class="award"><img src="${TROPHY.gold}" alt="" width="200" height="240"></div>
  </section>`;
}

function scores(day){
  const per = day.activities.map((a, ai) => {
    let got = 0; a.items.forEach((it, qi) => { if (S.answers[ai+'-'+qi] === it.ans) got++; });
    return {title:a.title, got, of:a.items.length};
  });
  const got = per.reduce((s,x)=>s+x.got,0), of = per.reduce((s,x)=>s+x.of,0);
  return {per, got, of, pct: Math.round(100*got/of)};
}

function renderResult(){
  const day = dayOf(S.day);
  if (!S.done){ S.done = true; S.finishedAt = new Date().toISOString(); save(); }
  const r = scores(day);
  const tier = r.pct >= 90 ? ['gold','Gold Trophy','Outstanding work!',3] : r.pct >= 75 ? ['silver','Silver Trophy','Very good job!',2] : ['bronze','Bronze Trophy','Good effort! Review the lesson and try again.',1];

  document.getElementById('nav').hidden = true;
  document.getElementById('meter').style.width = '100%';
  const m = document.getElementById('main');

    <div class="award">

      <div class="stars" aria-label="${tier[3]} of 3 stars">${'★'.repeat(tier[3])}${'☆'.repeat(3-tier[3])}</div>
      <h2>${tier[1]}</h2><p class="sub">${esc(tier[2])}</p>
    </div>
    <div class="ticket">
      <div class="hd"><b>SCORE SLIP</b><span>${DATA.slip || 'TLE-FCS 9 &bull; Week 4'} &bull; ${NM(day)}</span><span>${esc(day.title)}</span></div>
      <dl class="who">
        <dt>Name</dt><dd>${esc(S.name)}</dd>
        <dt>Section</dt><dd>${esc(S.section)}</dd>
        <dt>Finished</dt><dd>${esc(when)}</dd>
        <dt>Attempt</dt><dd>#${S.attempt}</dd>
      </dl>
      <div class="lines">${r.per.map((p,i)=>`<div class="ln"><span>Act. ${i+1} ${esc(p.title)}</span><b>${p.got}/${p.of}</b></div>`).join('')}</div>
      <div class="tot"><span>TOTAL</span><span>${r.got}/${r.of} <small>(${r.pct}%)</small></span></div>
    </div>
    <p class="note">Take a screenshot of this page and send it to your teacher.</p>
    <div id="again"></div>
    <div class="row">
      <button type="button" class="btn ghost" id="reviewBtn">Review my answers</button>
      ${DATA.days.length>1?'<button type="button" class="btn ghost" id="homeBtn">Choose another day</button>':''}
      <button type="button" class="btn ghost" id="retryBtn">Try this day again</button>
      ${DATA.home?`<a class="btn ghost" href="${DATA.home}">All lessons</a>`:''}
    </div>
  </section>`;
  const hb = document.getElementById('homeBtn'); if (hb) hb.onclick = () => renderHome();
  stagger(m); lastShown = null;
  syncVoiceBtn();
  sayIfOn('Congratulations, ' + S.name + '! ' + tier[1] + '. ' + tier[2] + ' Your total score is ' + r.got + ' out of ' + r.of + '.');
  document.getElementById('reviewBtn').onclick = () => { S.idx = screens.findIndex(s => s.t === 'intro'); render(); };
  document.getElementById('retryBtn').onclick = () => {
    document.getElementById('again').innerHTML = `<div class="confirm"><p>Start ${NM(day)} again? Your answers will be cleared and your result slip will show attempt #${(store.get(AKEY(day.num))||1)+1}.</p>
      <div class="row"><button type="button" class="btn primary" id="yesRetry">Yes, start again</button><button type="button" class="btn ghost" id="noRetry">Cancel</button></div></div>`;
    document.getElementById('noRetry').onclick = () => document.getElementById('again').innerHTML = '';
    document.getElementById('yesRetry').onclick = () => { store.del(KEY(day.num)); startDay(day.num, S.name, S.section); };
  };
  window.scrollTo(0,0);
}

document.getElementById('nextBtn').onclick = () => {
  const sc = screens[S.idx];
  if (sc.t === 'q' && !((sc.a+'-'+sc.q) in S.answers)) return;
  if ((sc.t === 'lesson' || sc.t === 'howto') && revealOne()) return;
  if (sc.t === 'finish'){ S.idx = screens.length; save(); renderResult(); return; }
  S.idx = Math.min(S.idx + 1, screens.length - 1); save(); render();
};
document.getElementById('backBtn').onclick = () => {
  if (S.idx === 0){ renderHome(); return; }
  S.idx--; save(); render();
};

/* boot */
(function(){
  const m = /^#day([1-4])$/.exec(location.hash || '');
  if (m) homeDay = Number(m[1]);
  if (DATA.days.length === 1) homeDay = DATA.days[0].num;
  renderHome();
})();
</script>
