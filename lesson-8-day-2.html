yment details private from others", "Never adding random charges to the guest bill", "Returning the change on a tray with thanks"], "ans": "B", "why": "Do not announce payment details to the table or other guests. Keep the guest's privacy."}, {"q": "What is the INTEGRITY CHECK in billing?", "opts": ["Giving the bill to the host or payer politely", "Comparing the menu, slip, and bill line by line", "Not announcing payment details to the guests", "No random charges, kept change, or tip pressure"], "ans": "D", "why": "Integrity means never adding random charges, keeping change, or pressuring the guest for a tip."}]}, {"title": "Analyze It", "kind": "Multiple choice: analysis", "minutes": 7, "how": "Study each case. Compare, find the error, or put the steps in order. Then choose the best answer.", "items": [{"q": "Why should a server say \"Excuse me\" before serving?", "opts": ["So other tables know the food has arrived", "So the guest is aware and does not bump into you", "So the kitchen hears that the order is out", "So the guest pays the bill right after eating"], "ans": "B", "why": "Saying \"Excuse me\" makes the guest aware, which keeps serving safe and courteous."}, {"q": "Which of these is a SANITATION mistake?", "opts": ["Clearing glassware on a beverage tray", "Using tongs for ready-to-eat food items", "Keeping thumbs off the rim of the plate", "Serving a utensil that fell on the floor"], "ans": "D", "why": "Never serve utensils or food that dropped on the floor. The other actions are correct."}, {"q": "Why is glassware cleared SEPARATELY on a beverage tray?", "opts": ["Glasses can tip over and break under plates", "Glasses look much nicer when carried alone", "Beverage trays are lighter to carry around", "Plates need more space than glasses need"], "ans": "A", "why": "Separating glassware keeps loads low and balanced and prevents breakage."}, {"q": "\"Time is recorded only if the setup is accurate, safe, quiet, and complete.\" What does this rule show?", "opts": ["Quiet work is optional in the challenge", "Speed is the main goal of all clearing", "Safety and accuracy come before speed", "Only the fastest team gets any points"], "ans": "C", "why": "Speed is useful only after safety and accuracy are maintained."}, {"q": "A server counts the tip on the change tray while the guests are still seated. What is wrong?", "opts": ["It slows down the cashier's billing process", "It is disrespectful and breaks service ethics", "It makes the change tray dirty and wet", "It shows the server is good at counting"], "ans": "B", "why": "Do not touch the change tray or count any tip while guests are still at the table."}]}, {"title": "Apply It", "kind": "Multiple choice: situational application", "minutes": 8, "how": "All choices look similar in length, so read carefully. Choose the BEST action: courteous, accurate, and safe.", "items": [{"q": "The bill shows an item the guest did not order. What is BEST?", "opts": ["Cross out the item yourself with a ballpen", "Present it and fix it only if the guest notices", "Correct it with the cashier before presenting it", "Ask the guest to pay now and refund it later"], "ans": "C", "why": "Review figures before presenting. Errors are corrected through the cashier, never hidden."}, {"q": "The guests have paid and are leaving. Their change is on the tray. What is BEST?", "opts": ["Return the change and thank them sincerely", "Keep the change since they are leaving now", "Wait for them to leave the change as a tip", "Ask them if the change is a tip for you"], "ans": "A", "why": "Give back the change on a tray and thank the guest. Never ask for a tip."}, {"q": "After the guests leave, you find a broken glass under the table. What is BEST?", "opts": ["Cover it with the tablecloth for the moment", "Push it aside and re-set the table quickly", "Leave it for the next shift to clean up", "Clean it up safely and inspect the floor"], "ans": "D", "why": "Inspect the floor for spills or breakage and clean safely before re-setting."}, {"q": "New guests are waiting, and the condiment bottle on the table is sticky. What is BEST?", "opts": ["Leave it there since the guests are waiting", "Replace it with a clean, approved bottle", "Wipe the outside with a used table napkin", "Refill it using another sticky bottle"], "ans": "B", "why": "Replenish table amenities and condiments only if they are clean and approved."}, {"q": "You need to clear a plate, but a guest is seated between you and the plate. What is BEST?", "opts": ["Ask the guest to pass the plate over to you", "Reach across the guest to clear the plate faster", "Wait until the whole restaurant is already empty", "Say \"excuse me\" and clear without reaching across"], "ans": "D", "why": "Clear from the correct side when practical, say \"excuse me,\" and avoid reaching across guests."}]}], "minutes": 45, "intro": true, "name": "Lesson 8 - Day 2", "label": "Day 2 of 2", "cover": "Lesson 8 &bull; Day 2 of 2"}], "slides": {"9": {"title": "Serving Rules: Safe, Courteous, and Controlled", "sub": "Serving is not just placing food on the table. It combines safety, awareness, timing, and respectful communication.", "cards": [{"h": "Tray safety", "b": "Place heavier items in the center. Avoid overloading. Carry only what you can control while seeing your path.", "list": null}], "bullets": ["Say “Excuse me” before serving so the guest is aware.", "Announce the dish clearly: “Your kare-kare, ma’am/sir.”", "Serve courses in the correct order and clear previous plates when required.", "Use tongs, forks, or serving spoons for ready-to-eat foods.", "Keep fingers and thumbs away from food-contact areas.", "Never serve utensils or food that dropped on the floor."], "table": null, "task": "", "quote": "", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3 Your change, sir/ma’am. Thank you.”", "list": null}, {"h": "Do not wait for tips", "b": "Never ask for a tip. Do not touch the change tray or count any tip while guests are still at the table.", "list": null}, {"h": "Assist safely", "b": "Help with chairs only when appropriate and check that no belongings were left behind.", "list": null}, {"h": "Practice line:", "b": "“Thank you for dining with us. We hope to see you again.”", "list": null}], "bullets": [], "table": null, "task": "Reflection question: What is one action that makes guests feel respected even after they paid?", "quote": "", "img": null}, "13": {"title": "Clearing the Table After Guests Leave", "sub": "Good clearing techniques improve productivity, avoid accidents, reduce guest inconvenience, and prepare the dining area for the next table.", "cards": [{"h": "Safety first", "b": "Speed is useful only after safety and accuracy are maintained.", "list": null}], "bullets": ["Clear all soiled dishes and unused mise en place.", "Clear from the correct side when practicable; avoid reaching across.", "Separate flatware and service ware by type.", "Clear glassware separately on beverage trays.", "Work quietly and unobtrusively.", "Crumb the table and change linens neatly.", "Inspect the floor for spills or breakage."], "table": null, "task": "", "quote": "", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGsAvgDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QAThAAAQMCBAMEBwUEBggFBQEBAQACAwQRBRIhMQZBURMiYXEHFDKBkaGxI0JScsEVM2LRFiRDY4LhJTRTc5KisvAmNUTC8RdUg4STRVX/xAAZAQADAQEBAAAAAAAAAAAAAAAAAQIDBAX/xAAlEQEBAAICAwACAwEAAwAAAAAAAQIREiEDMUEyURMiYQQUQnH/2gAMAwEAAhEDEQA/AKaHiF0ZFquT/wDoVbjHa6PDvXW1LhCDv22vwW4hwWhc2zqWI36sCg4jwphsjTalj8rLivkdUwYeTjWsdH9hXyNfyuQVG/ppxC3QVod5sBV3VcKULZv9WYBfkmpeHMPFwILeRWmOcZ5YVAoeO ence", "b": "Follows service stages from welcome to re-set.", "list": null}, {"h": "Guest Care", "b": "Respects privacy, comfort, accessibility, and belongings.", "list": null}, {"h": "Communication", "b": "Uses polite, clear, inclusive service language.", "list": null}, {"h": "Sanitation", "b": "Clears, segregates, sanitizes, and handles dropped items properly.", "list": null}, {"h": "Order Accuracy", "b": "Records and repeats orders completely.", "list": null}, {"h": "Teamwork", "b": "Rotates roles and supports the flow without crowding.", "list": null}, {"h": "Safety", "b": "Uses safe routes, tray balance, lifting, and food handling.", "list": null}, {"h": "Reflection", "b": "Uses feedback to improve one specific action.", "list": null}], "bullets": [], "table": null, "task": "", "quote": "", "img": null}, "18": {"title": "Reflection: Professionalism in Action", "sub": "Restaurant service prepares learners for hospitality, tourism, entrepreneurship, and everyday respectful interaction.", "cards": [{"h": "Exit ticket", "b": "Complete: “In food service, I will show professionalism by ________.”", "list": null}], "bullets": ["What went well in our service simulation?", "What action made guests feel most respected?", "What safety step must never be skipped?", "What service skill should I improve next time?", "How can I apply these skills in school, home, or a future career?"], "table": null, "task": "", "quote": "", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGsAvgDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QASRAAAgEDAgMFBQYEBQIEBQQDAQIDAAQRBSESMUEGE1FhcRQiMoGRByNCUqHBM3Kx0RUkQ1NiguEWkqLwNERUY3MlZLLxJoPC/8QAGQEAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAKhEAAgICAgICAwABBQEBAAAAAAECEQMhEjEEQRNRIjJhUhRCcYGxoZH/2gAMAwEAAhEDEQA/ANLLpFyinjec7cw1QvY5UuFUTTqC2Dv0xVyssqfDI4 const ACT_COLORS = ['var(--teal)','var(--orange)','var(--green)'];
const LETTERS = 'ABCD';

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const KEY = d => (DATA.key || 'fcs9w4') + '-progress-day' + d;
const AKEY = d => (DATA.key || 'fcs9w4') + '-attempts-day' + d;

let S = null;          // current session state
let screens = [];      // flattened screen list for the chosen day
let homeDay = 1;
let lastShown = null;  // screen last animated, so re-renders after answering do not replay the reveal


/* ---------------- read aloud (browser text-to-speech) ---------------- */
const VOICE_OK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let homeVoice = (store.get('fcs9-voice') === true);
function pickVoice(){
  if (!VOICE_OK) return null;
  const want = (DATA.lang || 'en').toLowerCase();
  const vs = speechSynthesis.getVoices();
  const pref = want.startsWith('fil') ? ['fil', 'tl'] : [want.slice(0,2)];
  for (const p of pref){ const v = vs.find(x => x.lang && x.lang.toLowerCase().replace('_','-').startsWith(p)); if (v) return v; }
  return null;
}
function speak(text){
  if (!VOICE_OK || !text) return;
  try {
    speechSynthesis.cancel();
    const clean = String(text).replace(/[✔✘★☆»«▾♫☝]/g, '').replace(/_{2,}/g, ' blank ').replace(/\s+/g, ' ').trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    const v = pickVoice();
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = DATA.lang || 'en-US';
    u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch(e) {}
}
function stopSpeak(){ if (VOICE_OK) try { speechSynthesis.cancel(); } catch(e) {} }
function voiceOn(){ return !!(S && S.voice && VOICE_OK); }
function sayIfOn(text){ if (voiceOn()) speak(text); }
function syncVoiceBtn(){
  const b = document.getElementById('voiceBtn');
  b.hidden = !VOICE_OK;
  b.setAttribute('aria-pressed', voiceOn());
  b.innerHTML = '&#9835; Read to me: ' + (voiceOn() ? 'ON' : 'OFF');
}
function screenText(root){
  return [...root.querySelectorAll('.screen > *')].filter(el => !el.hidden).map(el => el.innerText).join('. ');
}
if (VOICE_OK){ try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch(e) {} }
document.addEventListener('click', e => {
  if (e.target.closest('#voiceBtn') && S){
    S.voice = !S.voice; save(); syncVoiceBtn();
    store.set('fcs9-voice', S.voice);
    if (S.voice) sayIfOn(screenText(document.getElementById('main'))); else stopSpeak();
  }
});

/* click-to-reveal: lesson and how-to screens show one part per tap on "Show more" */
let PARTS = [];
function revealParts(root){
  const sc = screens[S.idx];
  const groups = sc && sc.t === 'howto' ? '.nogroup' : '.cards,.bul';
  const out = [];
  const kids = [...root.querySelectorAll('.screen > *')].slice(1);   // first child = title block
  kids.forEach(el => {
    if (el.matches(groups)) out.push(...el.children);
    else if (el.querySelector(':scope > .plan')) { [...el.children].forEach(c => c.matches(groups) ? out.push(...c.children) : out.push(c)); }
    else out.push(el);
  });
  return out;
}
function setupReveal(root){
  PARTS = revealParts(root);
  if (!S.rev) S.rev = {};
  const shown = Math.min(S.rev[S.idx] || 0, PARTS.length);
  PARTS.forEach((el, i) => { el.hidden = i >= shown; });
  updateRevealButton();
}
function updateRevealButton(){
  const shown = (S.rev && S.rev[S.idx]) || 0;
  const next = document.getElementById('nextBtn'), note = document.getElementById('navNote');
  if (shown < PARTS.length){
    next.innerHTML = 'Show more &#9662;';
    note.textContent = (PARTS.length - shown) + ' more to show';
  } else {
    next.innerHTML = 'Next &raquo;';
    note.textContent = '';
  }
}
function revealOne(){
  const shown = (S.rev && S.rev[S.idx]) || 0;
  if (shown >= PARTS.length) return false;
  const el = PARTS[shown];
  el.hidden = false;
  el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal');
  el.style.animationDelay = '0ms';
  S.rev[S.idx] = shown + 1; save();
  updateRevealButton();
  el.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  sayIfOn(el.innerText);
  return true;
}

/* reveal the parts of a screen one after another */
function stagger(root){
  const groups = '.cards,.bul,.opts,.rules,.plan,.facts,.days,.fields,.lines,.row';
  const items = [];
  root.querySelectorAll('.screen > *').forEach(el => {
    if (el.matches(groups)) items.push(...el.children);
    else if (el.querySelector(':scope > .cards, :scope > .plan, :scope > .days, :scope > .fields')) {
      [...el.children].forEach(c => c.matches(groups) ? items.push(...c.children) : items.push(c));
    } else items.push(el);
  });
  items.forEach((el, i) => {
    el.classList.add('reveal');
    el.style.animationDelay = (i < 10 ? i * 160 : 1600 + (i - 10) * 80) + 'ms';
  });
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function NM(d){ return d.name || ('Day ' + d.num); }
function dayOf(n){ return DATA.days.find(d => d.num === n); }

function buildScreens(day){
  const list = [{t:'howto'}];
  for (const e of day.sequence){
    if (typeof e === 'number') list.push({t:'lesson', s:e});
    else {
      const ai = Number(e.slice(1)) - 1;
      if (day.intro !== false) list.push({t:'intro', a:ai});
      day.activities[ai].items.forEach((_, qi) => list.push({t:'q', a:ai, q:qi}));
    }
  }
  list.push({t:'finish'});
  return list;
}

/* ---------------- home ---------------- */
function renderHome(msg){
  stopSpeak();
  document.getElementById('top').hidden = true;
  document.getElementById('nav').hidden = true;
  const saved = DATA.days.map(d => store.get(KEY(d.num)));
  const prof = store.get('fcs-site-profile') || {};
  const m = document.getElementById('main');
  m.innerHTML = `
  <section class="screen">
    <div class="hero">
      ${DATA.home?`<a class="homelink" href="${DATA.home}">&laquo; All lessons</a>`:''}
      <span class="eyebrow">${DATA.course || 'TLE-FCS 9 &bull; Term 1, Week 4'}${DATA.days.length===1?' &bull; '+(DATA.days[0].label || ('Lesson 4 - Day '+DATA.days[0].num)):''}</span>
      <h1 class="h1">${DATA.days.length===1?NM(DATA.days[0])+': '+esc(DATA.days[0].title):'Attributes of a Food Service Attendant'}</h1>
      <p class="sub">${DATA.days.length===1?esc(DATA.days[0].blurb)+'. About '+(DATA.days[0].minutes||40)+' minutes. ':'A self-paced lesson for each day, about 40 minutes. '}Read each screen, answer every activity, and earn your trophy.</p>
    </div>
    <div ${DATA.days.length===1?'hidden':''}>
      <p class="eyebrow" style="margin-bottom:8px">1. Choose today's lesson</p>
      <div class="days">${DATA.days.map((d,i) => `
        <button type="button" class="day" data-day="${d.num}" aria-pressed="${d.num===homeDay}">
          <b>Day ${d.num}${saved[i] && !saved[i].done ? ' &bull; in progress' : (saved[i] && saved[i].done ? ' &bull; done' : '')}</b>
          <span>${esc(d.title)}</span>
          <small>3 activities &bull; ${d.activities.reduce((a,x)=>a+x.items.length,0)} items</small>
        </button>`).join('')}
      </div>
    </div>
    <div>
      <p class="eyebrow" style="margin-bottom:8px">${DATA.days.length===1?'Before you start':'2. Tell us who you are'}</p>
      <div class="fields">
        <label class="f" for="nm">Full name<input type="text" id="nm" autocomplete="name" placeholder="e.g. Juan Dela Cruz" value="${esc(prof.name||'')}"></label>
        <label class="f" for="sec">Grade &amp; section<input type="text" id="sec" placeholder="e.g. 9-Sampaguita" value="${esc(prof.section||'')}"></label>
      </div>
      <p class="err" id="err">${msg ? esc(msg) : ''}</p>
    </div>
    <div ${VOICE_OK ? '' : 'hidden'}>
      <p class="eyebrow" style="margin-bottom:8px">How do you want to learn?</p>
      <div class="modes">
        <button type="button" class="day" data-voice="0" aria-pressed="${!homeVoice}"><b>Option 1</b><span>I will read it myself</span><small>Quiet reading at my own pace</small></button>
        <button type="button" class="day" data-voice="1" aria-pressed="${homeVoice}"><b>Option 2</b><span>Read it to me</span><small>The lesson is read aloud. Turn on your sound.</small></button>
      </div>
    </div>
    <button type="button" class="btn primary big" id="startBtn"></button>
  </section>`;
  const setStartLabel = () => {
    const sv = store.get(KEY(homeDay));
    document.getElementById('startBtn').innerHTML = (sv && !sv.done ? 'Continue ' : 'Start ') + NM(dayOf(homeDay)) + ' &raquo;';
  };
  setStartLabel();
  m.querySelectorAll('.day').forEach(b => b.onclick = () => {
    homeDay = Number(b.dataset.day);
    m.querySelectorAll('.day').forEach(x => x.setAttribute('aria-pressed', x === b));
    setStartLabel();
  });
  stagger(m); lastShown = null;
  m.querySelectorAll('[data-voice]').forEach(b => b.onclick = () => {
    homeVoice = b.dataset.voice === '1';
    m.querySelectorAll('[data-voice]').forEach(x => x.setAttribute('aria-pressed', x === b));
    if (homeVoice) speak('Sige! Babasahin ko ang aralin para sa iyo.');
    else stopSpeak();
  });
  document.getElementById('startBtn').onclick = () => {
    const name = document.getElementById('nm').value.trim();
    const section = document.getElementById('sec').value.trim();
    if (name.length < 2){ document.getElementById('err').textContent = 'Please type your full name first.'; document.getElementById('nm').focus(); return; }
    if (!section){ document.getElementById('err').textContent = 'Please type your grade and section.'; document.getElementById('sec').focus(); return; }
    store.set('fcs-site-profile', {name, section});
    startDay(homeDay, name, section);
  };
  window.scrollTo(0,0);
}

function startDay(n, name, section){
  const day = dayOf(n);
  screens = buildScreens(day);
  const sv = store.get(KEY(n));
  if (sv && !sv.done && sv.name === name){
    S = sv;
  } else {
    const attempts = (store.get(AKEY(n)) || 0) + 1;
    store.set(AKEY(n), attempts);
    S = {day:n, name, section, idx:0, answers:{}, attempt:attempts, done:false, finishedAt:null};
  }
  S.section = section;
  S.voice = homeVoice;
  save();
  render();
}
function save(){ store.set(KEY(S.day), S); }

/* ---------------- player ---------------- */
function render(){
  const day = dayOf(S.day);
  const sc = screens[S.idx];
  document.getElementById('top').hidden = false;
  document.getElementById('nav').hidden = sc.t === 'result';
  document.getElementById('topChip').textContent = NM(day);
  document.getElementById('topLabel').textContent = day.title;
  document.getElementById('meter').style.width = Math.round(100 * S.idx / (screens.length - 1)) + '%';
  const m = document.getElementById('main');
  const back = document.getElementById('backBtn'), next = document.getElementById('nextBtn'), note = document.getElementById('navNote');
  back.disabled = false; next.disabled = false; next.innerHTML = 'Next &raquo;'; note.textContent = '';
  m.style.removeProperty('--act');

  if (sc.t === 'howto') m.innerHTML = viewHowto(day);
  else if (sc.t === 'lesson') m.innerHTML = viewLesson(DATA.slides[sc.s]);
  else if (sc.t === 'intro'){ m.style.setProperty('--act', ACT_COLORS[sc.a]); m.innerHTML = viewIntro(day, sc.a); next.innerHTML = 'Begin &raquo;'; }
  else if (sc.t === 'q'){
    m.style.setProperty('--act', ACT_COLORS[sc.a]);
    m.innerHTML = viewQ(day, sc.a, sc.q);
    const k = sc.a + '-' + sc.q;
    if (!(k in S.answers)){ next.disabled = true; note.textContent = 'Answer to unlock Next'; }
    m.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(sc, b.dataset.l));
  }
  else if (sc.t === 'finish'){ m.innerHTML = viewFinish(day); next.innerHTML = 'Show my trophy &raquo;'; }
  window.scrollTo(0,0);
  const h = m.querySelector('h1,h2'); if (h){ h.setAttribute('tabindex','-1'); }
  const fresh = lastShown !== S.idx;
  if (sc.t === 'lesson' || sc.t === 'howto'){ setupReveal(m); lastShown = S.idx; }
  else { PARTS = []; if (fresh){ stagger(m); lastShown = S.idx; } }
  syncVoiceBtn();
  if (fresh) { if (voiceOn()) speak(screenText(m)); else stopSpeak(); }
}

function viewHowto(day){
  return `<section class="screen">
    <div><span class="eyebrow">${day.cover || ('Day ' + day.num + ' of 4')}</span><h1 class="h1" style="margin-top:6px">${esc(day.title)}</h1><p class="sub" style="margin-top:6px">${esc(day.blurb)}</p></div>
    <div class="rules">
      <div class="rule"><span class="n">1</span><div><h3>Read and study</h3><p>Go through each lesson screen with Next and Back.</p></div></div>
      <div class="rule"><span class="n">2</span><div><h3>Answer the activities</h3><p>Tap the answer you think is right. You get one try per item.</p></div></div>
      <div class="rule"><span class="n">3</span><div><h3>Read the feedback</h3><p>See why the answer is correct. Then Next unlocks.</p></div></div>
      <div class="rule"><span class="n">4</span><div><h3>Earn your trophy</h3><p>Finish all 3 activities, then screenshot your result for your teacher.</p></div></div>
    </div>
    <div><p class="eyebrow" style="margin-bottom:8px">${day.minutes||40}-minute time plan</p>
      <div class="plan">${day.plan.map(([l,m]) => `<div class="${l.startsWith('Activity')?'act':''}"><span>${esc(l)}</span><em>${m} min</em></div>`).join('')}</div>
    </div>
  </section>`;
}

function viewLesson(sl){
  let h = `<section class="screen"><div>`;
  h += `<h1 class="h2">${esc(sl.title)}</h1>`;
  if (sl.sub) h += `<p class="sub" style="margin-top:6px">${esc(sl.sub)}</p>`;
  h += `</div>`;
  if (sl.img) h += `<figure class="sfig"><img src="${sl.img}" alt="" loading="lazy"></figure>`;
  if (sl.quote) h += `<p class="quote">${esc(sl.quote)}</p>`;
  else if (sl.title === 'Essential Question' && sl.bullets.length) h += `<p class="quote">${esc(sl.bullets[0])}</p>`;
  else if (sl.bullets.length) h += `<ul class="bul">${sl.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
  if (sl.cards.length) h += `<div class="cards">${sl.cards.map(c => `<div class="card${c.img?' hasimg':''}">${c.img?`<img class="cimg" src="${c.img}" alt="" loading="lazy">`:''}${c.h?`<h3>${esc(c.h)}</h3>`:''}${c.b?`<p>${esc(c.b)}</p>`:''}${c.list?`<ul class="mini">${c.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`;
  if (sl.table){
    const [hd, ...rows] = sl.table;
    const blank = rows.some(r => r.some(c => !c));
    h += `<div class="tablebox"><table><thead><tr>${hd.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if (blank) h += `<p class="task"><b>Write it:</b> Copy this table into your notebook and fill it in.</p>`;
  }
  if (sl.task){
    const i = sl.task.indexOf(':');
    h += `<p class="task"><b>${esc(i>0 && i<40 ? sl.task.slice(0,i) : 'Remember')}:</b> ${esc(i>0 && i<40 ? sl.task.slice(i+1).trim() : sl.task)}</p>`;
  }
  return h + `</section>`;
}

function viewIntro(day, ai){
  const a = day.activities[ai];
  return `<section class="screen">
    <div class="actbadge"><span class="big">${ai+1}</span><div class="meta"><b>Activity ${ai+1}</b><span>${esc(a.title)}</span></div></div>
    <div class="facts">
      <div class="fact"><b>Type</b>${esc(a.kind)}</div>
      <div class="fact"><b>What to do</b>${esc(a.how)}</div>
      <div class="fact"><b>Items and time</b>${a.items.length} items, about ${a.minutes} minutes</div>
      <div class="fact"><b>Scoring</b>1 point for each correct answer. One try per item, so think before you tap.</div>
    </div>
  </section>`;
}

function viewQ(day, ai, qi){
  const a = day.activities[ai], it = a.items[qi], k = ai + '-' + qi;
  const picked = S.answers[k];
  const done = picked !== undefined;
  const lines = it.q.split('\n');
  const scramble = lines.length > 1 && /^[A-Z]+$/.test(lines[0]);
  const tf = it.opts.length === 2 && it.opts[0] === 'TRUE';
  let h = `<section class="screen">
    <div class="qhead"><span class="eyebrow" style="color:var(--act)">Activity ${ai+1}: ${esc(a.title)}</span></div>
    <div class="qhead"><span class="count">Item ${qi+1} of ${a.items.length}</span><span class="dots">${a.items.map((_,j)=>`<i class="${j<=qi?'on':''}"></i>`).join('')}</span></div>
    <div class="qcard ${scramble?'scr':''}"><p class="q">${esc(lines[0])}</p>${lines.slice(1).map(l=>`<p class="clue">${esc(l)}</p>`).join('')}</div>
    <div class="opts" role="group" aria-label="Answer choices">`;
  it.opts.forEach((o, j) => {
    const L = LETTERS[j];
    let cls = 'opt' + (tf ? ' tf' : '');
    if (done){ if (L === it.ans) cls += ' right'; else if (L === picked) cls += ' wrong'; else cls += ' dim'; }
    h += `<button type="button" class="${cls}" data-l="${L}" ${done?'disabled':''}>${tf ? esc(o) : `<span class="l">${L}</span><span>${esc(o)}</span>`}</button>`;
  });
  h += `</div>`;
  if (done){
    const ok = picked === it.ans;
    h += `<div class="fb ${ok?'ok':'no'}"><strong>${ok ? '✔ Correct! +1 point' : '✘ Not quite. The answer is ' + it.ans + '.'}</strong><p>${esc(it.why)}</p></div>`;
  } else h += `${(day.intro === false && qi === 0) ? `<p class="task"><b>Activity ${ai+1}:</b> ${esc(a.how)}</p>` : ''}<p class="hint">Tap the best answer. You only get one try for this item.</p>`;
  return h + `</section>`;
}

function answer(sc, L){
  const k = sc.a + '-' + sc.q;
  if (k in S.answers) return;
  S.answers[k] = L;
  save();
  const y = window.scrollY;
  render();
  const fb = document.querySelector('.fb');
  window.scrollTo(0, y);
  if (fb) fb.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  if (fb) sayIfOn(fb.innerText);
}

function viewFinish(day){
  const total = day.activities.reduce((a,x)=>a+x.items.length,0);
  return `<section class="screen">
    <div><span class="eyebrow">All activities answered</span><h1 class="h1" style="margin-top:6px">You finished ${NM(day)}!</h1></div>
    <ul class="bul">
      <li>You studied ${esc(day.title)}.</li>
      <li>You answered all ${total} items in 3 activities.</li>
      <li>Tap <b>Show my trophy</b> to see your scores. Take a screenshot of it and send it to your teacher.</li>
    </ul>
    <div class="award"><img src="${TROPHY.gold}" alt="" width="200" height="240"></div>
  </section>`;
}

function scores(day){
  const per = day.activities.map((a, ai) => {
    let got = 0; a.items.forEach((it, qi) => { if (S.answers[ai+'-'+qi] === it.ans) got++; });
    return {title:a.title, got, of:a.items.length};
  });
  const got = per.reduce((s,x)=>s+x.got,0), of = per.reduce((s,x)=>s+x.of,0);
  return {per, got, of, pct: Math.round(100*got/of)};
}

function renderResult(){
  const day = dayOf(S.day);
  if (!S.done){ S.done = true; S.finishedAt = new Date().toISOString(); save(); }
  const r = scores(day);
  const tier = r.pct >= 90 ? ['gold','Gold Trophy','Outstanding work!',3] : r.pct >= 75 ? ['silver','Silver Trophy','Very good job!',2] : ['bronze','Bronze Trophy','Good effort! Review the lesson and try again.',1];
  const when = new Date(S.finishedAt).toLocaleString('en-PH', {dateStyle:'medium', timeStyle:'short'});
  document.getElementById('top').hidden = false;
  document.getElementById('nav').hidden = true;
  document.getElementById('meter').style.width = '100%';
  const m = document.getElementById('main');
  m.innerHTML = `<section class="screen">
    <div class="award">
      <img src="${TROPHY[tier[0]]}" alt="${tier[1]}" width="200" height="240">
      <div class="stars" aria-label="${tier[3]} of 3 stars">${'★'.repeat(tier[3])}${'☆'.repeat(3-tier[3])}</div>
      <h2>${tier[1]}</h2><p class="sub">${esc(tier[2])}</p>
    </div>
    <div class="ticket">
      <div class="hd"><b>SCORE SLIP</b><span>${DATA.slip || 'TLE-FCS 9 &bull; Week 4'} &bull; ${NM(day)}</span><span>${esc(day.title)}</span></div>
      <dl class="who">
        <dt>Name</dt><dd>${esc(S.name)}</dd>
        <dt>Section</dt><dd>${esc(S.section)}</dd>
        <dt>Finished</dt><dd>${esc(when)}</dd>
        <dt>Attempt</dt><dd>#${S.attempt}</dd>
      </dl>
      <div class="lines">${r.per.map((p,i)=>`<div class="ln"><span>Act. ${i+1} ${esc(p.title)}</span><b>${p.got}/${p.of}</b></div>`).join('')}</div>
      <div class="tot"><span>TOTAL</span><span>${r.got}/${r.of} <small>(${r.pct}%)</small></span></div>
    </div>
    <p class="note">Take a screenshot of this page and send it to your teacher.</p>
    <div id="again"></div>
    <div class="row">
      <button type="button" class="btn ghost" id="reviewBtn">Review my answers</button>
      ${DATA.days.length>1?'<button type="button" class="btn ghost" id="homeBtn">Choose another day</button>':''}
      <button type="button" class="btn ghost" id="retryBtn">Try this day again</button>
      ${DATA.home?`<a class="btn ghost" href="${DATA.home}">All lessons</a>`:''}
    </div>
  </section>`;
  const hb = document.getElementById('homeBtn'); if (hb) hb.onclick = () => renderHome();
  stagger(m); lastShown = null;
  syncVoiceBtn();
  sayIfOn('Congratulations, ' + S.name + '! ' + tier[1] + '. ' + tier[2] + ' Your total score is ' + r.got + ' out of ' + r.of + '.');
  document.getElementById('reviewBtn').onclick = () => { S.idx = screens.findIndex(s => s.t === 'intro'); render(); };
  document.getElementById('retryBtn').onclick = () => {
    document.getElementById('again').innerHTML = `<div class="confirm"><p>Start ${NM(day)} again? Your answers will be cleared and your result slip will show attempt #${(store.get(AKEY(day.num))||1)+1}.</p>
      <div class="row"><button type="button" class="btn primary" id="yesRetry">Yes, start again</button><button type="button" class="btn ghost" id="noRetry">Cancel</button></div></div>`;
    document.getElementById('noRetry').onclick = () => document.getElementById('again').innerHTML = '';
    document.getElementById('yesRetry').onclick = () => { store.del(KEY(day.num)); startDay(day.num, S.name, S.section); };
  };
  window.scrollTo(0,0);
}

document.getElementById('nextBtn').onclick = () => {
  const sc = screens[S.idx];
  if (sc.t === 'q' && !((sc.a+'-'+sc.q) in S.answers)) return;
  if ((sc.t === 'lesson' || sc.t === 'howto') && revealOne()) return;
  if (sc.t === 'finish'){ S.idx = screens.length; save(); renderResult(); return; }
  S.idx = Math.min(S.idx + 1, screens.length - 1); save(); render();
};
document.getElementById('backBtn').onclick = () => {
  if (S.idx === 0){ renderHome(); return; }
  S.idx--; save(); render();
};

/* boot */
(function(){
  const m = /^#day([1-4])$/.exec(location.hash || '');
  if (m) homeDay = Number(m[1]);
  if (DATA.days.length === 1) homeDay = DATA.days[0].num;
  renderHome();
})();
</script>
